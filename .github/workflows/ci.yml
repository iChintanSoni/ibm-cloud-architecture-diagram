name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # packages/ui-web and apps/web typecheck/test against packages/core's built
      # dist output (see package.json "types"/"main"), so packages must be built
      # before the rest of the workspace can be checked.
      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      # Includes the axe-core accessibility smoke test (docs/07-accessibility.md#testing--ci).
      - name: Test
        run: pnpm -r test
