name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # packages/ui-web and apps/web typecheck/test against packages/core's built
      # dist output (see package.json "types"/"main"), so packages must be built
      # before the rest of the workspace can be checked.
      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm -r lint

      # Includes the axe-core accessibility smoke test (packages/core/docs/accessibility.md#testing--ci).
      - name: Test
        run: pnpm -r test

  # A separate job, not a step above: the perf benchmark asserts wall-clock budgets, which are
  # only meaningful run alone on an otherwise-idle machine — under `pnpm -r test`, six package
  # suites run concurrently and starve it regardless of the code under test
  # (I18, docs/improvement-plan.md#i18--isolate-the-perf-benchmark-from-parallel-load). GitHub
  # Actions gives each job its own runner, so this gets the isolation a step in build-and-test
  # never could.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Performance benchmark
        run: pnpm test:perf

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @icad/web exec playwright install --with-deps chromium

      # Real-browser accessibility + keyboard-only E2E flows (packages/core/docs/accessibility.md#testing--ci):
      # the axe-core check in the "Test" job above runs under jsdom, which can't evaluate
      # layout-dependent rules (color-contrast, ...) or drive real Tab-key focus traversal.
      - name: E2E tests (Playwright + axe-core)
        run: pnpm --filter @icad/web test:e2e
