packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  "@carbon/colors": false
  "@carbon/feature-flags": false
  "@carbon/grid": false
  "@carbon/icon-helpers": false
  "@carbon/icons-react": false
  "@carbon/layout": false
  "@carbon/motion": false
  "@carbon/react": false
  "@carbon/styles": false
  "@carbon/themes": false
  "@carbon/type": false
  "@carbon/utilities": false
  "@ibm/plex": false
  "@ibm/plex-mono": false
  "@ibm/plex-sans": false
  "@ibm/plex-sans-arabic": false
  "@ibm/plex-sans-devanagari": false
  "@ibm/plex-sans-hebrew": false
  "@ibm/plex-sans-thai": false
  "@ibm/plex-sans-thai-looped": false
  "@ibm/plex-serif": false
  "@parcel/watcher": true
  # Both only needed for `vsce publish` (Marketplace auth + package signing), not local
  # `vsce package` — declined, same reasoning as the Carbon/Plex entries above.
  "@vscode/vsce-sign": false
  esbuild: true
  keytar: false
minimumReleaseAgeExclude:
  - sass@1.101.6
